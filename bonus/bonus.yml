# https://oneuptime.com/blog/post/2026-02-21-how-to-use-ansible-to-deploy-to-kubernetes-via-helm/view

- name: Install GitLab via Helm
  hosts: localhost
  connection: local
  vars:
    ns: gitlab
    release_name: gitlab
    chart_ref: "gitlab/gitlab"

  tasks:

  - name: Install Helm
    ansible.builtin.include_role:
      name: helm
      apply:
        become: true

  - name: Create GitLab namespace
    # https://docs.ansible.com/projects/ansible/latest/collections/kubernetes/core/k8s_module.html
    kubernetes.core.k8s:
      name: "{{ ns }}"
      api_version: v1
      kind: Namespace
      state: present

  - name: Add GitLab Helm repository
    kubernetes.core.helm_repository:
      name: gitlab
      repo_url: https://charts.gitlab.io

  - name: Update Helm repositories
    ansible.builtin.command: helm repo update
    changed_when: false

  - name: Deploy Helm chart
    kubernetes.core.helm:
      name: "{{ release_name }}"
      chart_ref: "{{ chart_ref }}"
      chart_version: 9.11.12
      release_namespace: "{{ ns }}"
      create_namespace: true
      values_files:
        - gitlab-values.yml
      wait: true
      timeout: 7m
      atomic: true
